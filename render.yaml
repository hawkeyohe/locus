services:
  - type: web
    name: locus-staging
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m sentinel.server
    healthCheckPath: /health/ready
    envVars:
      - key: LOCUS_ENV
        value: production
      - key: LOCUS_DATABASE_URL
        sync: false
      - key: LOCUS_ENCRYPTION_KEY
        generateValue: true
      - key: LOCUS_METRICS_TOKEN
        generateValue: true
      - key: LOCUS_APP_URL
        value: https://locus-staging.onrender.com
      - key: LOCUS_HOST
        value: 0.0.0.0
      - key: LOCUS_PORT
        value: "8000"
      - key: LOCUS_DEMO_SEED
        value: "false"
      - key: LOCUS_ALLOW_LOCAL_ENDPOINTS
        value: "false"
      - key: LOCUS_EMBEDDED_WORKER
        value: "true"
      - key: LOCUS_SINGLE_SERVICE_MODE
        value: "true"
      - key: LOCUS_WORKER_CONCURRENCY
        value: "1"
