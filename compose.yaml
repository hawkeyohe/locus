services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: locus
      POSTGRES_USER: locus
      POSTGRES_PASSWORD: locus-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locus -d locus"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - locus-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["python", "-m", "scripts.migrate"]
    environment: &locus-environment
      LOCUS_ENV: development
      LOCUS_DATABASE_URL: postgresql://locus:locus-development-only@postgres:5432/locus
      LOCUS_ENCRYPTION_KEY: development-only-change-me
      LOCUS_APP_URL: http://web:8000
      LOCUS_DEMO_SEED: "true"
      LOCUS_ALLOW_LOCAL_ENDPOINTS: "true"
      LOCUS_EMBEDDED_WORKER: "false"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    environment: *locus-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "scripts.worker"]
    environment: *locus-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  locus-postgres:
