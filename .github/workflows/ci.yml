name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e .
      - name: Initialize schema
        env:
          LOCUS_DATABASE_PATH: /tmp/locus-ci.db
          LOCUS_DEMO_SEED: "false"
        run: python -m scripts.migrate
      - name: Compile Python
        run: python -m compileall -q sentinel scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate frontend JavaScript
        run: node --check web/app.js
